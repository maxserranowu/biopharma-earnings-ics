    calname: "HCRx Counterparties"
    caldesc: "Earnings calls for HCRx portfolio counterparties."
    alarm_minutes: 15
    tickers:
      # Active / recent
      - VNDA    # Vanda - Fanapt/Bysanti (your live deal)
      - BBIO    # BridgeBio - Jul 2026 pref equity; BEYONTTRA Jun 2025
